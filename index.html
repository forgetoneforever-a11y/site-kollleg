<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Медиа-Заметки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Шапка приложения -->
        <header class="app-header">
            <div class="header-title">
                <h2>📅 Календарь и Медиа-Заметки</h2>
                <span class="header-subtitle">Синхронизировано с LocalStorage</span>
            </div>
            <div class="header-controls">
                <span class="status-dot"></span>
            </div>
        </header>

        <!-- Основной контент: Календарь и Заметки -->
        <div class="main-grid">
            <!-- Блок календаря -->
            <div class="card calendar-card">
                <div class="calendar-header-nav">
                    <button id="prevMonthBtn" class="control-btn">◀</button>
                    <h3 id="calendarMonthTitle">Сентябрь 2026</h3>
                    <button id="nextMonthBtn" class="control-btn">▶</button>
                </div>
                <!-- Сетка календаря, куда JS вставляет дни -->
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>

            <!-- Блок заметок -->
            <div class="card notes-card">
                <div class="notes-header">
                    <h3 id="selectedDateSubtitle">Заметки на день</h3>
                    <span id="taskCounter" class="task-counter">0 историй</span>
                </div>
                
                <div class="notes-input-area">
                    <input type="text" id="noteInput" placeholder="Новая задача или заметка...">
                    <button id="addNoteBtn" class="add-btn">⚡</button>
                </div>

                <div id="notesList" class="notes-list">
                    <!-- Сюда JS выводит список задач -->
                </div>
            </div>
        </div>

        <!-- Системный лог -->
        <div class="card log-card">
            <div class="log-header">
                <span>Системный лог</span>
                <button id="clearLogsBtn" class="clear-btn">Очистить</button>
            </div>
            <div id="logContent" class="log-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
