<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Общая Заметка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Общие сбросы и стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            /* Отключаем стандартный курсор на всем сайте, если используется кастомный */
            cursor: none !important;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-x: hidden;
        }

        /* Кастомный курсор */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            background: rgba(88, 166, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
        }

        /* Увеличение курсора при наведении на интерактивные элементы */
        body.cursor-hover .custom-cursor {
            width: 36px;
            height: 36px;
            background: rgba(88, 166, 255, 0.4);
            border: 2px solid #58a6ff;
        }

        /* Шапка приложения */
        header {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-icon {
            font-size: 28px;
        }

        .app-title h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .app-title p {
            font-size: 13px;
            color: #8b949e;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #238636;
            border-radius: 50%;
            box-shadow: 0 0 8px #238636;
        }

        /* Увеличенные и яркие кнопки Расписание и ИИ Чат */
        .action-btn {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #2ea043, #3fb950);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(35, 134, 54, 0.4);
        }

        .ai-btn {
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
        }

        .ai-btn:hover {
            background: linear-gradient(135deg, #388bfd, #58a6ff);
            box-shadow: 0 6px 16px rgba(31, 111, 235, 0.4);
        }

        .icon-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s, border-color 0.2s;
        }

        .icon-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        /* Основной контент */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
        }

        /* Календарь */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .nav-arrow {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .nav-arrow:hover {
            background: #30363d;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #c9d1d9;
            transition: all 0.2s;
            position: relative;
        }

        .day-cell:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        .day-cell.selected {
            background: #1f6feb;
            border-color: #388bfd;
            color: #ffffff;
            font-weight: 600;
        }

        .day-cell.has-note::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 4px;
            height: 4px;
            background-color: #58a6ff;
            border-radius: 50%;
        }

        .day-cell.selected.has-note::after {
            background-color: #ffffff;
        }

        /* Заметки */
        .notes-section h2 {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-section h2 span {
            font-size: 13px;
            color: #8b949e;
            font-weight: 400;
        }

        .note-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .note-input {
            flex: 1;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .note-input:focus {
            border-color: #58a6ff;
        }

        .time-picker {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 0 12px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            width: 100px;
        }

        .add-note-btn {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .add-note-btn:hover {
            background: #2ea043;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #8b949e;
        }

        .checkbox-group input {
            accent-color: #1f6feb;
            width: 16px;
            height: 16px;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .note-item {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .note-text {
            font-size: 14px;
            color: #f0f6fc;
        }

        .note-meta {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            gap: 12px;
        }

        .delete-note {
            background: transparent;
            border: none;
            color: #f85149;
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .delete-note:hover {
            opacity: 0.8;
        }

        /* Системный лог */
        .log-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px 24px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #8b949e;
        }

        .clear-log {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 13px;
            transition: color 0.2s;
        }

        .clear-log:hover {
            color: #f0f6fc;
        }

        .log-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px;
            font-family: monospace;
            font-size: 13px;
            height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-system { color: #58a6ff; }
        .log-time { color: #3fb950; }
    </style>
</head>
<body>

    <!-- Кастомный курсор -->
    <div class="custom-cursor" id="customCursor"></div>

    <!-- Шапка -->
    <header>
        <div class="header-left">
            <div class="app-icon">📅</div>
            <div class="app-title">
                <h1>Календарь и Общая Заметка</h1>
                <p>Группа 211 • Технология машиностроения</p>
            </div>
        </div>
        <div class="header-right">
            <div class="status-dot" title="Система активна"></div>
            <button class="action-btn" onclick="alert('Открытие расписания...')">
                <span>📋</span> Расписание
            </button>
            <button class="action-btn ai-btn" onclick="alert('Запуск ИИ Чата...')">
                <span>🤖</span> ИИ Чат
            </button>
            <button class="icon-btn" title="Настройки">⚙️</button>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="main-container">
        <!-- Календарь -->
        <div class="card">
            <div class="calendar-header">
                <button class="nav-arrow" id="prevMonth">◄</button>
                <h2 id="monthYearTitle">Сентябрь 2026</h2>
                <button class="nav-arrow" id="nextMonth">►</button>
            </div>
            <div class="weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="days-grid" id="daysGrid">
                <!-- Дни генерируются скриптом -->
            </div>
        </div>

        <!-- Заметки -->
        <div class="card notes-section">
            <h2>
                Заметки на <span id="selectedDateText">2026-09-18</span>
                <span id="historyCount">1 историй</span>
            </h2>
            <div class="note-input-group">
                <input type="text" class="note-input" id="noteInput" placeholder="Новая задача или событие...">
                <input type="time" class="time-picker" id="noteTime" value="12:00">
                <button class="add-note-btn" id="addNoteBtn">Добавить</button>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="telegramSync" checked>
                <label for="telegramSync">Дублировать в Telegram-бот</label>
            </div>
            <div class="notes-list" id="notesList">
                <div class="note-item">
                    <div class="note-content">
                        <span class="note-text">fzcxfdv</span>
                        <div class="note-meta">
                            <span style="color: #3fb950;">12:00</span>
                            <span style="color: #58a6ff;">✓ Отправлено в TG</span>
                        </div>
                    </div>
                    <button class="delete-note">Удалить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Системный лог -->
    <div class="log-card">
        <div class="log-header">
            <span>Системный лог (Render & Telegram)</span>
            <button class="clear-log" onclick="clearLog()">Очистить</button>
        </div>
        <div class="log-box" id="logBox">
            <div><span class="log-system">[Система]</span> Ожидание действий пользователя...</div>
            <div><span class="log-time">[19:42:30]</span> Система полностью инициализирована.</div>
        </div>
    </div>

    <script>
        /* Плавное движение кастомного курсора */
        const cursor = document.getElementById('customCursor');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateCursor() {
            // Плавное преследование (интерполяция)
            cursorX += (mouseX - cursorX) * 0.2;
            cursorY += (mouseY - cursorY) * 0.2;
            cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
            requestAnimationFrame(updateCursor);
        }
        requestAnimationFrame(updateCursor);

        // Эффект увеличения при наведении на интерактивные элементы
        const interactiveElements = document.querySelectorAll('button, input, .day-cell, a');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        });

        // Генерация дней календаря
        const daysGrid = document.getElementById('daysGrid');
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        let currentDate = new Date(2026, 8, 18); // Сентябрь 2026

        function renderCalendar() {
            daysGrid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthYearTitle').textContent = `${monthNames[month]} ${year}`;

            // Первый день месяца и количество дней
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // Сдвиг под понедельник
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Пустые ячейки для предыдущего месяца
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell';
                emptyCell.style.opacity = '0.3';
                daysGrid.appendChild(emptyCell);
            }

            // Дни текущего месяца
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                if (day === 18 && month === 8) {
                    dayCell.classList.add('selected', 'has-note');
                }
                dayCell.textContent = day;
                dayCell.addEventListener('click', () => {
                    document.querySelectorAll('.day-cell').forEach(c => c.classList.remove('selected'));
                    dayCell.classList.add('selected');
                    document.getElementById('selectedDateText').textContent = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                });
                daysGrid.appendChild(dayCell);
            }
        }

        renderCalendar();

        function clearLog() {
            document.getElementById('logBox').innerHTML = '<div><span class="log-system">[Система]</span> Лог очищен.</div>';
        }
    </script>
</body>
</html>
