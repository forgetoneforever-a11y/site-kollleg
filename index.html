<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Медиа-Заметки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Шапка приложения -->
        <header class="app-header glass-panel">
            <div class="app-title-area">
                <h2>📅 Календарь и Медиа-Заметки</h2>
                <span class="app-subtitle">Синхронизировано с LocalStorage и Telegram</span>
            </div>
            <div class="app-controls">
                <div class="status-indicator" title="Сервер активен"></div>
                <button id="settingsBtn" class="control-btn" title="Настройки">⚙️</button>
            </div>
        </header>

        <!-- Основная сетка -->
        <div class="main-content-grid">
            <!-- Блок календаря -->
            <div class="glass-panel calendar-card">
                <div class="calendar-nav">
                    <button id="prevMonthBtn" class="nav-btn">◀</button>
                    <h3 id="calendarMonthTitle">Сентябрь 2026</h3>
                    <button id="nextMonthBtn" class="nav-btn">▶</button>
                </div>
                <div id="calendarGrid" class="calendar-grid">
                    <!-- Заголовки дней недели и ячейки генерируются через JS -->
                </div>
            </div>

            <!-- Блок заметок -->
            <div class="glass-panel notes-card">
                <div class="notes-header">
                    <h3 id="selectedDateSubtitle">Заметки на день</h3>
                    <span id="taskCounter" class="task-counter">0 историй</span>
                </div>
                
                <div class="notes-input-area">
                    <input type="text" id="noteInput" placeholder="Новая задача или заметка...">
                    <button id="addNoteBtn" class="primary-btn">⚡</button>
                </div>

                <div id="notesList" class="notes-list">
                    <!-- Список задач динамический -->
                </div>
            </div>
        </div>

        <!-- Системный лог -->
        <div class="glass-panel system-log-panel">
            <div class="log-header">
                <span>Системный лог</span>
                <button id="clearLogsBtn" class="text-btn">Очистить</button>
            </div>
            <div id="logContent" class="log-content">
                <!-- Сюда падают логи -->
            </div>
        </div>
    </div>

    <!-- Подключаем твой финальный скрипт -->
    <script src="script.js"></script>
</body>
</html>
